# EIP-8297 PBT devnet, FAST variant: merged-from-genesis (package defaults
# put altair..fulu all at epoch 0; gloas/heze stay far-future — a bone-stock
# generator config), with the commitment scheduled via
# --experimental.binary-tree-delay instead of a flagged genesis. The
# generator's embedded (MPT) genesis hash is CORRECT here because genesis
# genuinely is MPT-committed; the flip happens ~30s in and shadow tracking
# carries the full state across. No fork ladder, no TTD transition, no
# preset games — cf. binary-tree-devnet.yaml for why the genesis-flag
# variant needs all of those.
#
# Run: make localnet KURTOSIS_CONFIG_FILE=./fixtures/networks/binary-tree-devnet-fast.yaml
participants:
  - el_type: ethrex
    el_image: ethrex:local
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.3
    validator_count: 32
    count: 3
    # Fulu/PeerDAS: at least one supernode (or 128+ validators on a node) is
    # required; marking the participant makes all replicas supernodes.
    supernode: true
    el_extra_params:
      - "--experimental.binary-tree-delay=30"
      # Devnet-only: widen the RPC namespace allowlist for test tooling.
      - "--http.api=eth,net,web3,debug,admin,txpool"

ethereum_metrics_exporter_enabled: true

network_params:
  seconds_per_slot: 3
  # NO fork_epoch overrides: the package defaults are all-at-genesis
  # (verified at the pinned revision), which is exactly what we want —
  # genesis is MPT-committed, so the CL's embedded genesis hash matches.

additional_services:
  - dora
  - spamoor

spamoor_params:
  spammers:
    # Gentle EOA-transfer load: enough to exercise per-block PBT commitment
    # and account creation without ballooning the re-embedded state.
    - scenario: eoatx
      config:
        throughput: 20
